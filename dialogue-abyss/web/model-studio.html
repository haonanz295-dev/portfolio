<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话深渊 · 模型工作室</title><style>body{margin:0;background:#102d3a;color:#e5eadb;font:15px 'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:25px;left:28px;max-width:300px;background:#102d3adc;padding:22px;border:1px solid #adc9b944;border-radius:20px}h1{font-weight:400;font-size:25px}button,select,a{background:#224b58;color:#f3e5be;border:1px solid #adc9b955;border-radius:20px;padding:11px;text-decoration:none}p{line-height:1.8;color:#b9d3cb}small{display:block;margin-top:20px}</style><canvas id="studio"></canvas><aside><small>DIALOGUE ABYSS · ASSET STUDIO</small><h1>海洋伙伴 · 形象预览</h1><select id="species"></select><p id="description"></p><button id="rotate">暂停旋转</button><button id="save">保存渲染图</button><p>拖动环绕 · 滚轮调整远近<br>这是 Demo 的原创实时模型，可下载对应 glTF 文件继续精修。</p><a id="download" download>下载模型 glTF</a><small><a href="index.html">返回游戏</a></small></aside><script src="vendor/three.min.js"></script><script src="sculpted-models.js"></script><script>
const T=THREE,canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color(0x153542);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);scene.add(new T.HemisphereLight(0xc0e1ed,0x59654c,1.8));const key=new T.DirectionalLight(0xffe1b7,2.5);key.position.set(4,6,5);scene.add(key);const rim=new T.DirectionalLight(0x8ed4e4,2);rim.position.set(-5,3,-3);scene.add(rim);let model,angle=.5,pitch=.15,distance=7,spin=true,drag=false;
const names={ray:['沐沐 · 鳐鱼','薄荷绿的翼鳍与奶油腹面。侧翼同行，保持轻盈的回应。'],seahorse:['枝枝 · 海马','连续弯曲的躯干、卷尾和半透明背鳍。喜欢耐心地辨认小径。'],jelly:['绵绵 · 水母','柔透伞面、发光内核和曲线触须。安静停留，也是一种交流。'],octopus:['墨墨 · 章鱼','暖紫色的圆润头部、八条弯曲腕足和浅色吸盘。以手势表达欢迎。'],shark:['澄澄 · 鲨鱼','流线形身体、背鳍与鳃裂。保持边界，酷而温和。'],whale:['远声 · 鲸鱼','连续长躯干、浅色腹面和宽尾鳍。留出距离，也能陪伴。'],starfish:['岩岩 · 海星','柔软五角轮廓和温暖珊瑚色。慢慢观察海床。']};
const select=document.querySelector('#species');for(const [k,v] of Object.entries(names))select.add(new Option(v[0],k));function build(){if(model){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}model=AbyssModels[select.value]();scene.add(model);model.rotation.y=.3;distance=select.value==='whale'?18:select.value==='starfish'?3.5:7;document.querySelector('#description').textContent=names[select.value][1];document.querySelector('#download').href='assets/models/'+select.value+'.gltf'}select.onchange=build;build();document.querySelector('#rotate').onclick=e=>{spin=!spin;e.target.textContent=spin?'暂停旋转':'继续旋转'};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download=select.value+'-render.png';a.href=canvas.toDataURL('image/png');a.click()};canvas.onpointerdown=e=>{drag=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(drag){angle-=e.movementX*.006;pitch=Math.max(-1,Math.min(1,pitch+e.movementY*.004))}};canvas.onwheel=e=>{distance=Math.max(2,Math.min(28,distance+e.deltaY*.01))};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;if(spin&&!drag)angle+=dt*.2;camera.position.set(Math.sin(angle)*distance,Math.sin(pitch)*distance+1,Math.cos(angle)*distance);camera.lookAt(0,select.value==='whale'?0:-.1,0);renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
